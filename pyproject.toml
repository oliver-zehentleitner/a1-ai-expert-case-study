[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-analysis"
version = "0.1.0"
description = "SMS Spam/Ham Analysis – A1 AI Expert Case Study"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "nltk>=3.9",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "umap-learn>=0.5",
    "joblib>=1.4",
    "openai>=1.35",
    "ollama>=0.3",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
sms-analyze = "sms_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
